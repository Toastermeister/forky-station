  #   messageThresholds:
  #     70: DefaultBraingasp
  #   oxygenThresholds:
  #     0: DefaultBrainslump

- type: entity
  abstract: true
  id: BaseMobSurgery
  components:
  - type: Construction
    graph: SurgeryGraph
    node: Base
    deconstructionTarget: null
  - type: SurgeryGuideTarget
  - type: ContainerContainer
    containers:
      cavity_slot: !type:Container

- type: entity
  abstract: true
  id: BaseMobCryostasis
  components:
  - type: CryostasisFactor
    temperatureCoefficient: -0.03
    temperatureConstant: 10

- type: entity
  abstract: true
  id: BaseMobLungDamage
