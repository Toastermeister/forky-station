- type: entity
  abstract: true
  id: BaseMobWoundable
  components:
  - type: StatusEffectContainer
  - type: WoundableBody
  - type: HealthExaminable
    examinableTypes:
    - Asphyxiation
    - Radiation
  - type: WoundRegeneration
    damage:
      types:
        Blunt: -0.5
        Piercing: -0.5
        Slash: -0.5
        Heat: -0.5
        Cold: -0.5
        Shock: -0.5
  - type: Deathgasp
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
  - type: RadiationReceiver
  - type: Stamina
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Pullable
  - type: LightningTarget
    priority: 2
    lightningExplode: false

- type: entity
  abstract: true
  id: BaseMobPain
  components:
  - type: StatusEffectContainer
  - type: WoundableBody
  - type: HealthExaminable
    examinableTypes:
    - Asphyxiation
    - Radiation
  - type: Pain
    painMultiplier: 1.25
    maxShockIncreasePerSecond: 36
    maxShockDecreasePerSecond: 12
    doubleShockRecoveryThreshold: 0.5
  - type: IntrinsicPain
    painCoefficients:
      Poison: 0.7
      Radiation: 0.7
      Cellular: 0.7
  - type: ShockThresholds
    thresholds:
      10: StatusEffectMinorPain
      30: StatusEffectModeratePain
      60: StatusEffectSeverePain
      120: StatusEffectBlackoutPain
    mobThresholds: {}
  - type: ShockAlerts
    alertCategory: Pain
    suppressedAlert: SuppressedPain
    thresholds:
      0: NoPain
      10: MinorPain
      30: ModeratePain
      60: SeverePain
      120: BlackoutPain
  - type: ShockGaspThresholds
    messageThresholds:
      120: DefaultPainslump


    constantFactor: 0
  - type: HeartrateAlerts
    strainAlert: HeartRate
    stoppedAlert: HeartStopped
    alertCategory: Health
    maxStrain: 4
  - type: SolutionContainerManager
  - type: InjectableSolution
    solution: bloodstream
  - type: Bloodstream
    bleedReductionAmount: 0
    bloodlossDamage:
      types: {}
    bloodlossHealDamage:
      types: {}
    updateInterval: 1
  - type: CprTarget
    effect: StatusEffectActiveCPR
    effectDuration: 2.1
    doAfterDuration: 2
    wound: WoundFracture
    woundProbability: 0.03
  - type: IVTarget
    permissibleContainers:
      components:
      - CryoPod

- type: entity
  abstract: true
  id: BaseMobBrain
  components:
  - type: BrainDamageThresholds
    damageStateThresholds:
      70: Critical
      100: Dead
    oxygenStateThresholds:
      0: Critical
    damageEffectThresholds:
      30: StatusEffectSevereBrainDamage
      70: StatusEffectCriticalBrainDamage
    oxygenEffectThresholds:
      0: StatusEffectBrainNoOxygen
    aliveDamageIcons:
    - HealthIconNormal7
    - HealthIconNormal6
    - HealthIconNormal5
    - HealthIconNormal4
    - HealthIconNormal3
    - HealthIconNormal2
    - HealthIconNormal1
    criticalDamageIcons:
    - HealthIconCritical7
    - HealthIconCritical6
    - HealthIconCritical5
    - HealthIconCritical4
    - HealthIconCritical3
    - HealthIconCritical2
    - HealthIconCritical1
    deadIcon: HealthIconBrainDead
  # TODO: kill?
